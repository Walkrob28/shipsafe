name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ShipSafe so the free instance stays warm
        run: curl -sS --max-time 60 https://shipsafe-3s49.onrender.com/api/health || true
